**Accès refusé pour la création de pack sans authentification** : je devrais recevoir une erreur 401 le message d'erreur devrait indiquer \"Non authentifié\"

**Accès refusé pour les rôles non autorisés** : je devrais recevoir une erreur 403 le message d'erreur devrait indiquer \"Accès refusé : rôle insuffisant\"

