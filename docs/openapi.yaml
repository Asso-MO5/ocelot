  /museum/member-presences:
    post:
      tags:
        - Présences membres
      summary: "Créer ou mettre à jour la présence du membre connecté pour une date. Le membre peut indiquer s'il vient le matin, l'après-midi, ou les deux."
      description: "**Création d'une présence** : je devrais recevoir la présence créée la présence devrait contenir mon user_id et mon user_name

**Mise à jour d'une présence existante** : la présence devrait être mise à jour la période devrait être la nouvelle valeur

**Erreur si la date est invalide** : je devrais recevoir une erreur 400 le message d'erreur devrait indiquer \"Date invalide\"

**Erreur si mon identité n'existe pas** : je devrais recevoir une erreur 400 le message d'erreur devrait indiquer \"Utilisateur non trouvé\"

**Accès refusé sans authentification** : je devrais recevoir une erreur 401 le message d'erreur devrait indiquer \"Non authentifié\"

### Scénarios de test

**Création d'une présence**

📋 que je suis authentifié

⚡ je fais une requête POST vers \"/museum/member-presences\" avec une date et une période

✅ je devrais recevoir la présence créée

✅ la présence devrait contenir mon user_id et mon user_name

**Mise à jour d'une présence existante**

📋 qu'une présence existe déjà pour cette date

⚡ je fais une requête POST vers \"/museum/member-presences\" avec la même date et une nouvelle période

✅ la présence devrait être mise à jour

✅ la période devrait être la nouvelle valeur

**Erreur si la date est invalide**

📋 que je suis authentifié

⚡ je fais une requête POST vers \"/museum/member-presences\" avec une date invalide

✅ je devrais recevoir une erreur 400

✅ le message d'erreur devrait indiquer \"Date invalide\"

**Erreur si mon identité n'existe pas**

📋 que mon identité n'existe pas dans la base de données

⚡ je fais une requête POST vers \"/museum/member-presences\"

✅ je devrais recevoir une erreur 400

✅ le message d'erreur devrait indiquer \"Utilisateur non trouvé\"

**Accès refusé sans authentification**

📋 que je ne suis pas authentifié

⚡ je fais une requête POST vers \"/museum/member-presences\"

✅ je devrais recevoir une erreur 401

✅ le message d'erreur devrait indiquer \"Non authentifié\"

"
