paths:
  /auth/signin:
    get:
      tags:
        - Authentification
      summary: "Redirige vers Discord OAuth2 pour l'authentification"
      description: "**Démarrer une connexion OIDC protégée par PKCE** : je suis redirigé vers l'endpoint d'autorisation Zitadel la requête contient un state, un nonce et un code_challenge S256 les valeurs de transaction sont conservées dans des cookies HTTP-only signés et temporaires

**Refuser une configuration Zitadel incomplète** : je reçois une erreur 500 sans détail de secret

### Scénarios de test

**Démarrer une connexion OIDC protégée par PKCE**

📋 que je ne suis pas authentifié

⚡ je fais une requête GET vers \"/auth/signin\"

✅ je suis redirigé vers l'endpoint d'autorisation Zitadel

✅ la requête contient un state, un nonce et un code_challenge S256

✅ les valeurs de transaction sont conservées dans des cookies HTTP-only signés et temporaires

**Refuser une configuration Zitadel incomplète**

📋 que ZITADEL_ISSUER, ZITADEL_CLIENT_ID ou ZITADEL_CLIENT_SECRET est absent

⚡ je fais une requête GET vers \"/auth/signin\"

✅ je reçois une erreur 500 sans détail de secret

"
      operationId: "get_auth_signin"
      parameters:
      responses:
        302:
          description: "Redirection"
          content: null
          headers:
            Location:
              schema:
                type: "string"
              description: "URL de redirection"
        500:
          description: "Erreur serveur - je reçois une erreur 500 sans détail de secret"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  error:
                    type: "string"
                    description: "Message d'erreur"
                required:
                  - error
              example:
                error: "exemple_error"
          headers: null
  /auth/login:
    get:
      tags:
        - Authentification
      summary: "Alias de /auth/signin - Redirige vers Discord OAuth2"
      description: ""
      operationId: "get_auth_login"
      parameters:
      responses:
        302:
          description: "Redirection"
          content: null
          headers:
            Location:
              schema:
                type: "string"
              description: "URL de redirection"
        500:
          description: "Erreur serveur"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  error:
                    type: "string"
                    description: "Message d'erreur"
                required:
                  - error
              example: null
          headers: null
  /auth/callback:
    get:
      tags:
        - Authentification
      summary: "Callback OAuth2 de Discord - Échange le code d'autorisation contre des tokens"
      description: "**Finaliser un callback OIDC valide** : que Zitadel retourne un code d'autorisation et un ID token valide le code est échangé avec le verifier PKCE la signature, l'issuer, l'audience et le nonce de l'ID token sont vérifiés les jetons de session sont stockés dans des cookies HTTP-only je suis redirigé vers le frontend avec success=true

**Refuser un callback qui ne correspond pas à la transaction** : aucun jeton n'est échangé je suis redirigé vers le frontend avec error=invalid_state

### Scénarios de test

**Finaliser un callback OIDC valide**

📋 qu'un state, un nonce et un verifier valides ont été conservés

✅ que Zitadel retourne un code d'autorisation et un ID token valide

⚡ je fais une requête GET vers \"/auth/callback\"

✅ le code est échangé avec le verifier PKCE

✅ la signature, l'issuer, l'audience et le nonce de l'ID token sont vérifiés

✅ les jetons de session sont stockés dans des cookies HTTP-only

✅ je suis redirigé vers le frontend avec success=true

**Refuser un callback qui ne correspond pas à la transaction**

📋 que le state retourné est absent, invalide ou expiré

⚡ je fais une requête GET vers \"/auth/callback\"

✅ aucun jeton n'est échangé

✅ je suis redirigé vers le frontend avec error=invalid_state

"
      operationId: "get_auth_callback"
      parameters:
        - name: "code"
          in: "query"
          description: "Code d'autorisation retourné par Zitadel"
          required: false
          schema:
            type: "string"
            description: "Code d'autorisation retourné par Zitadel"
        - name: "error"
          in: "query"
          description: "Code d'erreur retourné par Zitadel"
          required: false
          schema:
            type: "string"
            description: "Code d'erreur retourné par Zitadel"
        - name: "state"
          in: "query"
          description: "État passé lors de la requête initiale"
          required: false
          schema:
            type: "string"
            description: "État passé lors de la requête initiale"
      responses:
  /auth/me:
    get:
      tags:
        - Authentification
      summary: "Récupère les informations de l'utilisateur authentifié (gère automatiquement le refresh du token)"
      description: "**Récupérer ma session et mes rôles Zitadel** : je reçois mon identité et les rôles présents dans le claim configuré mon subject Zitadel est conservé comme identité locale

### Scénarios de test

**Récupérer ma session et mes rôles Zitadel**

📋 que j'ai un access token Zitadel valide

⚡ je fais une requête GET vers \"/auth/me\"

✅ je reçois mon identité et les rôles présents dans le claim configuré

✅ mon subject Zitadel est conservé comme identité locale

"
      operationId: "get_auth_me"
      parameters:
      responses:
        200:
          description: "Succès"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  id:
                    type: "string"
                    description: "ID interne ou subject Zitadel de l'utilisateur"
                  username:
                    type: "string"
                    description: "Nom d'utilisateur"
                  avatar:
                    type:
                      - string
                    description: "URL de l'avatar ou null"
                    nullable: true
                  email:
                    type: "string"
                    description: "Email de l'utilisateur (si le scope email est accordé)"
                  roles:
                    type: "array"
                    description: "Rôles de l'utilisateur"
                    items:
                      type: "string"
                      description: "Nom du rôle"
                required:
                  - id
                  - username
                  - avatar
                  - roles
              example: null
          headers: null
        401:
          description: "Non authentifié"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  error:
                    type: "string"
                    description: "Message d'erreur"
                required:
                  - error
              example: null
          headers: null
        500:
          description: "Erreur serveur"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  error:
                    type: "string"
                    description: "Message d'erreur"
                required:
                  - error
              example: null
          headers: null
      security:
        - cookieAuth:
  /auth/signout:
    get:
      tags:
        - Authentification
      summary: "Déconnecte l'utilisateur en supprimant les cookies de session (discord_access_token et discord_refresh_token)"
      description: "**Déconnexion de l'utilisateur** : les cookies Zitadel et les cookies temporaires sont supprimés je reçois une réponse avec success=true

### Scénarios de test

**Déconnexion de l'utilisateur**

📋 que je suis authentifié avec Zitadel

⚡ je fais une requête GET vers \"/auth/signout\"

✅ les cookies Zitadel et les cookies temporaires sont supprimés

✅ je reçois une réponse avec success=true

"
      operationId: "get_auth_signout"
      parameters:
      responses:
        200:
          description: "Succès"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  success:
                    type: "boolean"
                    description: "Indique si la déconnexion a réussi"
                required:
                  - success
              example: null
          headers: null
  /pay/checkout/:sessionId:
    get:
      tags:
        - Paiement
      summary: "Vérifie le statut d'une session de checkout. Retourne le statut de paiement et les informations de la session (route publique)"
      description: ""
      operationId: "get_pay_checkout_:sessionId"
      parameters:
        - name: "sessionId"
          in: "path"
          description: "ID de la session de checkout"
          required: true
          schema:
            type: "string"
            description: "ID de la session de checkout"
      responses:
        200:
          description: "Succès"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  id:
                    type: "string"
                  amount_total:
                    type: "number"
                  currency:
                    type: "string"
                  status:
                    type: "string"
                    enum:
                      - open
                      - complete
                      - expired
                  payment_status:
                    type: "string"
                    enum:
                      - paid
                      - unpaid
                      - no_payment_required
                  payment_intent:
                    type: "string"
              example: null
          headers: null
        404:
          description: "Code 404"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  error:
                    type: "string"
              example: null
          headers: null
        500:
          description: "Erreur serveur"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  error:
                    type: "string"
              example: null
          headers: null
  /pay/webhook:
    post:
      tags:
        - Paiement
      summary: "Endpoint webhook pour recevoir les notifications de paiement. Met à jour automatiquement les tickets associés au session_id selon le statut du paiement (route publique)"
      description: "**Réception d'un webhook checkout.session.completed** : je reçois une réponse 200 les tickets associés sont mis à jour avec le statut de paiement les emails de confirmation sont envoyés si le paiement est réussi les certificats de don sont envoyés si des dons sont présents

**Réception d'un webhook payment_intent.succeeded** : je reçois une réponse 200 les tickets associés sont mis à jour avec le statut PAID

**Réception d'un webhook payment_intent.payment_failed** : je reçois une réponse 200 les tickets associés sont mis à jour avec le statut FAILED

**Réception d'un webhook checkout.session.expired** : je reçois une réponse 200 les tickets associés sont mis à jour avec le statut CANCELLED

**Erreur si la signature du webhook est invalide (production)** : qu'un webhook avec une signature invalide est reçu je reçois une erreur 400 le message d'erreur indique \"Signature invalide\"

**Webhook accepté avec signature invalide en développement** : qu'un webhook avec une signature invalide est reçu je reçois une réponse 200 le webhook est traité malgré la signature invalide

**Erreur si la signature est manquante** : je reçois une erreur 400 le message d'erreur indique \"Signature manquante\"

**Erreur si le raw body n'est pas disponible** : je reçois une erreur 500 le message d'erreur indique \"Raw body non disponible\"

**Mise à jour des informations client depuis customer_details** : que la session contient customer_details avec email, first_name, last_name les tickets associés sont mis à jour avec les informations client

**Traitement d'un événement non géré** : je reçois une réponse 200 la réponse indique success: true avec tickets_updated: 0

### Scénarios de test

**Réception d'un webhook checkout.session.completed**

📋 qu'un webhook Stripe est reçu

⚡ je fais une requête POST vers \"/pay/webhook\" avec un événement checkout.session.completed

✅ je reçois une réponse 200

✅ les tickets associés sont mis à jour avec le statut de paiement

✅ les emails de confirmation sont envoyés si le paiement est réussi

✅ les certificats de don sont envoyés si des dons sont présents

**Réception d'un webhook payment_intent.succeeded**

📋 qu'un webhook Stripe est reçu

⚡ je fais une requête POST vers \"/pay/webhook\" avec un événement payment_intent.succeeded

✅ je reçois une réponse 200

✅ les tickets associés sont mis à jour avec le statut PAID

**Réception d'un webhook payment_intent.payment_failed**

📋 qu'un webhook Stripe est reçu

⚡ je fais une requête POST vers \"/pay/webhook\" avec un événement payment_intent.payment_failed

✅ je reçois une réponse 200

✅ les tickets associés sont mis à jour avec le statut FAILED

**Réception d'un webhook checkout.session.expired**

📋 qu'un webhook Stripe est reçu

⚡ je fais une requête POST vers \"/pay/webhook\" avec un événement checkout.session.expired

✅ je reçois une réponse 200

✅ les tickets associés sont mis à jour avec le statut CANCELLED

**Erreur si la signature du webhook est invalide (production)**

📋 que l'environnement est en production

✅ qu'un webhook avec une signature invalide est reçu

⚡ je fais une requête POST vers \"/pay/webhook\"

✅ je reçois une erreur 400

✅ le message d'erreur indique \"Signature invalide\"

**Webhook accepté avec signature invalide en développement**

📋 que l'environnement est en développement

✅ qu'un webhook avec une signature invalide est reçu

⚡ je fais une requête POST vers \"/pay/webhook\"

✅ je reçois une réponse 200

✅ le webhook est traité malgré la signature invalide

**Erreur si la signature est manquante**

📋 qu'un webhook sans signature est reçu

⚡ je fais une requête POST vers \"/pay/webhook\"

✅ je reçois une erreur 400

✅ le message d'erreur indique \"Signature manquante\"

**Erreur si le raw body n'est pas disponible**

📋 qu'un webhook est reçu mais le raw body n'est pas disponible

⚡ je fais une requête POST vers \"/pay/webhook\"

✅ je reçois une erreur 500

✅ le message d'erreur indique \"Raw body non disponible\"

**Mise à jour des informations client depuis customer_details**

📋 qu'un webhook checkout.session.completed est reçu

✅ que la session contient customer_details avec email, first_name, last_name

⚡ je fais une requête POST vers \"/pay/webhook\"

✅ les tickets associés sont mis à jour avec les informations client

**Traitement d'un événement non géré**

📋 qu'un webhook avec un type d'événement non géré est reçu

⚡ je fais une requête POST vers \"/pay/webhook\"

✅ je reçois une réponse 200

✅ la réponse indique success: true avec tickets_updated: 0

"
      operationId: "post_pay_webhook"
      parameters:
      responses:
        200:
          description: "Succès - je reçois une réponse 200, les tickets associés sont mis à jour avec le statut de paiement, les emails de confirmation sont envoyés si le paiement est réussi, les certificats de don sont envoyés si des dons sont présents"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  success:
                    type: "boolean"
                    description: "Indique si le webhook a été traité avec succès"
                  tickets_updated:
                    type: "number"
                    description: "Nombre de tickets mis à jour"
                  qr_codes:
                    type: "array"
                    items:
                      type: "string"
                    description: "Liste des QR codes des tickets associés au checkout"
                required:
                  - success
                  - tickets_updated
                  - qr_codes
              example:
                success: true
                tickets_updated: 123
          headers: null
        400:
          description: "Code 400 - qu'un webhook avec une signature invalide est reçu, je reçois une erreur 400, le message d'erreur indique \"Signature invalide\""
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  error:
                    type: "string"
              example:
                error: "exemple_error"
          headers: null
        500:
          description: "Erreur serveur - je reçois une erreur 500, le message d'erreur indique \"Raw body non disponible\""
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  error:
                    type: "string"
              example:
                error: "exemple_error"
          headers: null
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              required:
                - id
                - type
                - data
              properties:
                id:
                  type: "string"
                  description: "ID de l'événement webhook"
                type:
                  type: "string"
                  description: "Type d'événement (checkout.session.completed, payment_intent.succeeded, etc.)"
                created:
                  type: "number"
                  description: "Timestamp Unix de l'événement"
                data:
                  type: "object"
                  required:
                    - object
                  properties:
                    object:
                      type: "object"
                      description: "Objet de l'événement (checkout.session ou payment_intent)"
                      properties:
                        id:
                          type: "string"
                        object:
                          type: "string"
                        amount_total:
                          type: "number"
                        currency:
                          type: "string"
                        status:
                          type: "string"
                        payment_status:
                          type: "string"
                        payment_intent:
                          type: "string"
                        metadata:
                          type: "object"
  /museum/schedules:
    post:
      tags:
        - Musée - Horaires
      summary: "Crée ou met à jour un horaire d'ouverture (UPSERT). Pour les exceptions : cherche par start_date, end_date et audience_type. Pour les horaires récurrents : cherche par day_of_week et audience_type. Retourne 201 si créé, 200 si mis à jour."
      description: "**Créer un horaire récurrent pour le public** : que je fournis day_of_week, start_time, end_time et audience_type=\"public\" je reçois une réponse 201 la réponse contient l'horaire créé avec un id la réponse contient day_of_week, start_time, end_time, audience_type

**Créer un horaire récurrent pour les membres** : que je fournis day_of_week, start_time, end_time et audience_type=\"member\" je reçois une réponse 201 la réponse contient l'horaire créé avec audience_type = \"member\"

**Créer une exception (horaires spécifiques pour une période)** : que je fournis is_exception = true que je fournis start_date et end_date que je fournis start_time, end_time et audience_type je reçois une réponse 201 la réponse contient is_exception = true la réponse contient start_date et end_date

**Créer une fermeture exceptionnelle** : que je fournis is_exception = true que je fournis is_closed = true que je fournis start_date et end_date que je fournis une description je reçois une réponse 201 la réponse contient is_closed = true la réponse contient la description

**Mettre à jour un horaire existant (upsert)** : qu'un horaire existe avec les mêmes critères que je fournis les mêmes critères avec de nouvelles données je reçois une réponse 200 la réponse contient l'horaire mis à jour

**Erreur lors de la création d'un horaire récurrent sans day_of_week** : que je ne fournis pas day_of_week que is_exception = false je reçois une réponse 400 la réponse contient un message d'erreur indiquant que day_of_week est requis

**Erreur lors de la création d'une exception sans dates** : que je fournis is_exception = true que je ne fournis pas start_date ou end_date je reçois une réponse 400 la réponse contient un message d'erreur indiquant que start_date et end_date sont requis

**Accès non autorisé pour créer un horaire sans authentification** : je reçois une réponse 401 la réponse contient un message d'erreur \"Non authentifié\"

**Accès non autorisé pour créer un horaire sans les rôles requis** : je reçois une réponse 403 la réponse contient un message d'erreur \"Accès refusé : rôle insuffisant\"

### Scénarios de test

**Créer un horaire récurrent pour le public**

📋 que je suis authentifié avec un rôle bureau, dev ou museum

⚡ je fais une requête POST vers \"/museum/schedules\"

✅ que je fournis day_of_week, start_time, end_time et audience_type=\"public\"

✅ je reçois une réponse 201

✅ la réponse contient l'horaire créé avec un id

✅ la réponse contient day_of_week, start_time, end_time, audience_type

**Créer un horaire récurrent pour les membres**

📋 que je suis authentifié avec un rôle bureau, dev ou museum

⚡ je fais une requête POST vers \"/museum/schedules\"

✅ que je fournis day_of_week, start_time, end_time et audience_type=\"member\"

✅ je reçois une réponse 201

✅ la réponse contient l'horaire créé avec audience_type = \"member\"

**Créer une exception (horaires spécifiques pour une période)**

📋 que je suis authentifié avec un rôle bureau, dev ou museum

⚡ je fais une requête POST vers \"/museum/schedules\"

✅ que je fournis is_exception = true

✅ que je fournis start_date et end_date

✅ que je fournis start_time, end_time et audience_type

✅ je reçois une réponse 201

✅ la réponse contient is_exception = true

✅ la réponse contient start_date et end_date

**Créer une fermeture exceptionnelle**

📋 que je suis authentifié avec un rôle bureau, dev ou museum

⚡ je fais une requête POST vers \"/museum/schedules\"

✅ que je fournis is_exception = true

✅ que je fournis is_closed = true

✅ que je fournis start_date et end_date

✅ que je fournis une description

✅ je reçois une réponse 201

✅ la réponse contient is_closed = true

✅ la réponse contient la description

**Mettre à jour un horaire existant (upsert)**

📋 que je suis authentifié avec un rôle bureau, dev ou museum

✅ qu'un horaire existe avec les mêmes critères

⚡ je fais une requête POST vers \"/museum/schedules\"

✅ que je fournis les mêmes critères avec de nouvelles données

✅ je reçois une réponse 200

✅ la réponse contient l'horaire mis à jour

**Erreur lors de la création d'un horaire récurrent sans day_of_week**

📋 que je suis authentifié avec un rôle bureau, dev ou museum

⚡ je fais une requête POST vers \"/museum/schedules\"

✅ que je ne fournis pas day_of_week

✅ que is_exception = false

✅ je reçois une réponse 400

✅ la réponse contient un message d'erreur indiquant que day_of_week est requis

**Erreur lors de la création d'une exception sans dates**

📋 que je suis authentifié avec un rôle bureau, dev ou museum

⚡ je fais une requête POST vers \"/museum/schedules\"

✅ que je fournis is_exception = true

✅ que je ne fournis pas start_date ou end_date

✅ je reçois une réponse 400

✅ la réponse contient un message d'erreur indiquant que start_date et end_date sont requis

**Accès non autorisé pour créer un horaire sans authentification**

📋 que je ne suis pas authentifié

⚡ je fais une requête POST vers \"/museum/schedules\"

✅ je reçois une réponse 401

✅ la réponse contient un message d'erreur \"Non authentifié\"

**Accès non autorisé pour créer un horaire sans les rôles requis**

📋 que je suis authentifié mais sans les rôles bureau, dev ou museum

⚡ je fais une requête POST vers \"/museum/schedules\"

✅ je reçois une réponse 403

✅ la réponse contient un message d'erreur \"Accès refusé : rôle insuffisant\"

"
      operationId: "post_museum_schedules"
      parameters:
      responses:
        200:
          description: "Succès - qu'un horaire existe avec les mêmes critères, que je fournis les mêmes critères avec de nouvelles données, je reçois une réponse 200, la réponse contient l'horaire mis à jour"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  id:
                    type: "string"
                  day_of_week:
                    type:
                      - integer
                    nullable: true
