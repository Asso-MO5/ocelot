**Créer un tarif pour les membres** : que je fournis amount, audience_type=\"member\" et translations avec au moins un name je reçois une réponse 201 la réponse contient le tarif créé avec audience_type = \"member\"

**Créer un tarif avec dates de validité** : que je fournis start_date et end_date valides que je fournis amount, audience_type et translations avec au moins un name je reçois une réponse 201 la réponse contient start_date et end_date

**Créer un tarif inactif** : que je fournis is_active = false que je fournis amount, audience_type et translations avec au moins un name je reçois une réponse 201 la réponse contient is_active = false

**Créer un tarif nécessitant un justificatif** : que je fournis requires_proof = true que je fournis amount, audience_type et translations avec au moins un name je reçois une réponse 201 la réponse contient requires_proof = true

**Mettre à jour un tarif existant (upsert)** : qu'un tarif existe avec un id spécifique que je fournis cet id avec les nouvelles données je reçois une réponse 200 la réponse contient le tarif mis à jour

**Erreur lors de la création d'un tarif avec montant négatif** : que je fournis un amount négatif je reçois une réponse 400 la réponse contient un message d'erreur indiquant que le montant doit être positif

**Erreur lors de la création d'un tarif avec dates invalides** : que je fournis start_date sans end_date je reçois une réponse 400 la réponse contient un message d'erreur indiquant que start_date et end_date doivent être définis ensemble

**Erreur lors de la création d'un tarif avec start_date après end_date** : que je fournis start_date après end_date je reçois une réponse 400 la réponse contient un message d'erreur indiquant que start_date doit être antérieure à end_date

**Erreur lors de la création d'un tarif sans traduction name** : que je fournis translations sans aucun champ name je reçois une réponse 400 la réponse contient un message d'erreur indiquant qu'au moins une traduction pour le champ \"name\" est requise

**Accès non autorisé pour créer un tarif sans authentification** : je reçois une réponse 401 la réponse contient un message d'erreur \"Non authentifié\"

**Accès non autorisé pour créer un tarif sans les rôles requis** : je reçois une réponse 403 la réponse contient un message d'erreur \"Accès refusé : rôle insuffisant\"

